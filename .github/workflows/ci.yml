name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # This repository produces a REQUIRED context on main. A merge queue gates each
  # speculative merge commit by running the required contexts against the
  # `gh-readonly-queue/*` ref, so WITHOUT this trigger the check never reports
  # there and every queue entry hangs until the timeout.
  #
  # Landing this BEFORE the queue is enabled is what MERGE_PROTOCOL.md section 3.1
  # requires: the trigger is inert until a queue exists, so this change is safe on
  # its own and cannot strand a merge.
  merge_group:

permissions:
  contents: read

# A push to main is a durable verdict for that exact commit. Keep it isolated by
# SHA and never cancel it; pull requests and merge groups stay ref-stable so a
# newer run for the same ref can replace an obsolete one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  go-quality:
    name: go quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"

      - name: CI concurrency contract
        shell: bash
        run: bash scripts/ci-workflow.test.sh

      # The gate's own controls run FIRST, so a PR that weakens the gate fails
      # before the gate is asked to judge the code.
      - name: Coverage gate controls
        shell: bash
        run: bash scripts/go-coverage-gate.test.sh

      - name: Per-package coverage floor
        shell: bash
        run: bash scripts/go-coverage-gate.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  native-mcp-security:
    name: native MCP security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native prerequisites
        run: for tool in bash jq curl grep awk; do command -v "$tool"; done

      - name: Shell syntax
        run: bash -n scripts/history-rag-mcp-native.sh scripts/history-rag-mcp-native.test.sh scripts/history-rag-mcp-native.mutation.test.sh scripts/docker-native.test.sh scripts/systemd-native.test.sh scripts/launchd-native.test.sh scripts/windows-native.test.sh scripts/docs-native-contract.test.sh scripts/start.sh scripts/go-coverage-gate.sh scripts/go-coverage-gate.test.sh scripts/ci-workflow.test.sh

      - name: Native MCP security contract
        run: bash scripts/history-rag-mcp-native.test.sh

      - name: Native deployment and documentation contracts
        run: |
          bash scripts/docker-native.test.sh
          bash scripts/systemd-native.test.sh
          bash scripts/windows-native.test.sh
          bash scripts/docs-native-contract.test.sh

      - name: Mutation strength
        run: bash scripts/history-rag-mcp-native.mutation.test.sh

  native-mcp-security-macos:
    name: native MCP security (macOS)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native prerequisites
        run: for tool in bash jq curl grep awk plutil; do command -v "$tool"; done

      - name: Shell syntax
        run: bash -n scripts/launchd-native.test.sh

      - name: Native launchd contract
        run: bash scripts/launchd-native.test.sh
