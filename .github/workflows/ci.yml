name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: go quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"

      - name: Test with per-package coverage floor
        shell: bash
        run: |
          set -o pipefail
          go test -count=1 -cover ./... | tee coverage.txt
          awk '
            /coverage:/ {
              value = $5
              sub(/%/, "", value)
              if ((value + 0) < 85) {
                print "coverage below 85%: " $2 " (" value "%)"
                failed = 1
              }
            }
            END { exit failed }
          ' coverage.txt

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  native-mcp-security:
    name: native MCP security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native prerequisites
        run: for tool in bash jq curl grep awk; do command -v "$tool"; done

      - name: Shell syntax
        run: bash -n scripts/history-rag-mcp-native.sh scripts/history-rag-mcp-native.test.sh scripts/history-rag-mcp-native.mutation.test.sh scripts/docker-native.test.sh scripts/systemd-native.test.sh scripts/launchd-native.test.sh scripts/windows-native.test.sh scripts/docs-native-contract.test.sh scripts/start.sh

      - name: Native MCP security contract
        run: bash scripts/history-rag-mcp-native.test.sh

      - name: Native deployment and documentation contracts
        run: |
          bash scripts/docker-native.test.sh
          bash scripts/systemd-native.test.sh
          bash scripts/windows-native.test.sh
          bash scripts/docs-native-contract.test.sh

      - name: Mutation strength
        run: bash scripts/history-rag-mcp-native.mutation.test.sh

  native-mcp-security-macos:
    name: native MCP security (macOS)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native prerequisites
        run: for tool in bash jq curl grep awk plutil; do command -v "$tool"; done

      - name: Shell syntax
        run: bash -n scripts/launchd-native.test.sh

      - name: Native launchd contract
        run: bash scripts/launchd-native.test.sh
